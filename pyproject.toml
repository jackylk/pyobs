[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyobsfs"
dynamic = ["version"]
description = "Huawei Cloud OBS filesystem implementation for fsspec"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [
    {name = "pyobs contributors"}
]
keywords = ["fsspec", "huawei", "obs", "cloud", "storage", "filesystem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "fsspec>=2023.1.0",
    "esdk-obs-python>=3.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "requests>=2.28.0",
]

[project.entry-points."fsspec.specs"]
obs = "pyobsfs:OBSFileSystem"
hwobs = "pyobsfs:OBSFileSystem"

[project.urls]
Homepage = "https://github.com/jackylk/pyobsfs"
Documentation = "https://github.com/jackylk/pyobsfs#readme"
Repository = "https://github.com/jackylk/pyobsfs"

[tool.setuptools.dynamic]
version = {attr = "pyobsfs._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require real OBS credentials)",
]
